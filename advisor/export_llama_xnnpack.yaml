# ExecuTorch export config: Llama 3.2 1B Instruct -> XNNPACK, 8-bit dynamic activations + 4-bit weights.
# Used with:  python -m extension.llm.export.export_llm --config <this file> base.checkpoint=... base.params=...
base:
  model_class: llama3_2
  metadata: '{"get_bos_id": 128000, "get_eos_ids": [128009, 128001]}'

model:
  use_kv_cache: True
  use_sdpa_with_kv_cache: True

export:
  max_seq_length: 512        # longest prompt processed in one go
  max_context_length: 1024   # prompt + generated tokens
  output_name: traceiq_llama32_1b_8da4w.pte

quantization:
  qmode: 8da4w               # int8 dynamic activations, int4 weights
  group_size: 32
  embedding_quantize: 4,32

backend:
  xnnpack:
    enabled: True
    extended_ops: True
